name: Release

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  # Called by ci.yml after it auto-tags a version bump on main. Tags pushed with
  # GITHUB_TOKEN don't trigger workflows, so the tag push alone wouldn't release.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Create Chrome zip
        run: |
          cd .output/chrome-mv3
          zip -r ../../grammar-check-chrome-${{ env.TAG }}.zip .
          cd ../..

      - name: Create Firefox zip
        run: |
          cd .output/firefox-mv2
          zip -r ../../grammar-check-firefox-${{ env.TAG }}.zip .
          cd ../..

      # Upload and submit for review. Skipped (not failed) until the CWS_* secrets are set.
      - name: Publish to Chrome Web Store
        env:
          EXTENSION_ID: oekphfmnojkeooldbpfpdjglgmmnallp
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning::CWS_* secrets not set; skipping Chrome Web Store upload."
            exit 0
          fi
          npx --yes chrome-webstore-upload-cli@3 --source "grammar-check-chrome-${TAG}.zip"

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since last tag
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Escape for GitHub Actions
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"

          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Grammar Check ${{ env.TAG }}
          body: |
            ## Grammar Check ${{ env.TAG }}

            A privacy-first, open-source AI grammar checker with local model support.

            ### Installation

            **Chrome / Edge / Brave:**
            1. Download `grammar-check-chrome-${{ env.TAG }}.zip`
            2. Extract the zip file
            3. Go to `chrome://extensions/`
            4. Enable "Developer mode"
            5. Click "Load unpacked" and select the extracted folder

            **Firefox:**
            1. Download `grammar-check-firefox-${{ env.TAG }}.zip`
            2. Go to `about:debugging#/runtime/this-firefox`
            3. Click "Load Temporary Add-on"
            4. Select any file from the extracted folder

            ### Changes

            ${{ steps.changelog.outputs.changelog }}

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ env.TAG }}...HEAD
          files: |
            grammar-check-chrome-${{ env.TAG }}.zip
            grammar-check-firefox-${{ env.TAG }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
